name: Build Unsigned iOS IPA

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from the GitHub UI

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-13
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Prebuild iOS Project
        run: npx expo prebuild --platform ios --clean

      - name: Build Unsigned App
        run: |
          cd ios
          # Dynamically find the workspace and scheme generated by Expo
          WORKSPACE=$(ls | grep .xcworkspace | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Building workspace: $WORKSPACE, Scheme: $SCHEME"
          
          # Run xcodebuild and explicitly disable code signing
          xcodebuild -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENTITLEMENTS_REQUIRED=NO

      - name: Package into IPA
        run: |
          mkdir -p Payload
          # Find the generated .app file and move it into the Payload folder
          APP_PATH=$(find ios/build/Build/Products/Release-iphoneos -name "*.app" | head -n 1)
          mv "$APP_PATH" Payload/
          
          # Zip it up as an .ipa file
          zip -r YTFocus.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YTFocus-IPA
          path: YTFocus.ipa
          retention-days: 7
